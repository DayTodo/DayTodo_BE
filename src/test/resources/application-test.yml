spring:
  datasource:
    driver-class-name: org.h2.Driver
    url: jdbc:h2:mem:daytodo;MODE=MySQL;DB_CLOSE_DELAY=-1
    username: sa
    password:

  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    hibernate:
      ddl-auto: create-drop

jwt:
  token:
    secretKey: test-secret-key-for-local-test-only-0123456789
    expiration:
      access: 1800000
      refresh: 1209600000
