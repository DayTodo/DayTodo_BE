spring:
  datasource:
    driver-class-name: org.h2.Driver
    url: jdbc:h2:mem:daytodo;MODE=MySQL;DB_CLOSE_DELAY=-1;DATABASE_TO_LOWER=TRUE
    username: sa
    password:
  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    hibernate:
      ddl-auto: create-drop
    show-sql: false
  task:
    scheduling:
      enabled: false

jwt:
  token:
    secretKey: test-secret-key-test-secret-key-test-secret-key
    expiration:
      access: 1800000
      refresh: 1209600000
