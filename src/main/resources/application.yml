spring:
  application:
    name: "daytodo"

  jackson:
    deserialization:
      # KorService2 는 결과 0건일 때 items 를 "" 로 내려주므로 빈 문자열을 null 객체로 처리
      accept-empty-string-as-null-object: true

  config:
    import: optional:file:.env[.properties]

  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: ${DB_URL}
    username: ${DB_USER}
    password: ${DB_PW}

  jpa:
    database: mysql
    database-platform: org.hibernate.dialect.MySQLDialect
    show-sql: true
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        format_sql: true

  mail:
    host: smtp.gmail.com
    port: 587
    username: ${MAIL_USERNAME}
    password: ${MAIL_PASSWORD}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
            required: true
          connectiontimeout: 3000
          timeout: 5000
          writetimeout: 5000

  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 6MB

jwt:
  token:
    secretKey: ${JWT_SECRET_KEY}
    expiration:
      access: 1800000    # 30분
      refresh: 1209600000 # 14일

naver:
  base-url: https://openapi.naver.com
  client-id: ${NAVER_CLIENT_ID}
  client-secret: ${NAVER_CLIENT_SECRET}

tour:
  base-url: https://apis.data.go.kr/B551011/KorService2
  service-key: ${TOUR_SERVICE_KEY}

aws:
  s3:
    bucket: ${AWS_S3_BUCKET:}
    region: ${AWS_REGION:}

firebase:
  enabled: ${FIREBASE_ENABLED:false}
  project-id: ${FIREBASE_PROJECT_ID:}

notification:
  zone: ${NOTIFICATION_ZONE:Asia/Seoul}
  course-reminder-cron: ${COURSE_REMINDER_CRON:0 0 9 * * *}
  dispatch-delay-ms: ${NOTIFICATION_DISPATCH_DELAY_MS:60000}
